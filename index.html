<body><div id="app"></div><div id="modal-root"></div>
<script>
(()=>{'use strict';
const CONFIG={PRIMARY_COLOR:'#6545a5',SECONDARY_COLOR:'#706a78',ACCENT_COLOR:'#de8845',BACKGROUND_COLOR:'#f7f6f8',TEXT_COLOR:'#292631',COMPANY_NAME:'LKX',APP_URL:'https://portal.seu-dominio.com.br'};
const KEY='portal_operacoes_demo_v1';
const initial={settings:{companyName:CONFIG.COMPANY_NAME,phone:'',whatsapp:'',email:'',domain:'',institutional:'',support:'',primaryColor:CONFIG.PRIMARY_COLOR,secondaryColor:CONFIG.SECONDARY_COLOR,accentColor:CONFIG.ACCENT_COLOR},operations:[]};
let db=load(),currentOp=null,toastTimer=null,returnTo='admin-dashboard';if(db.settings.companyName==='Portal de Operações')db.settings.companyName=CONFIG.COMPANY_NAME;if(db.settings.institutional==='Acompanhe as etapas da sua operação em um só lugar.')db.settings.institutional='Conclua as etapas da sua operação e acompanhe a disponibilização do valor.';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.operations)?x:structuredClone(initial)}catch{return structuredClone(initial)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function date(v,withTime=true){if(!v)return '—';let d=new Date(v);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})+(withTime?' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'')}function localNow(){return new Date().toISOString()}function statusLabel(s){return({AGUARDANDO_CADASTRO:'Aguardando cadastro',CADASTRO_CONCLUIDO:'Cadastro concluído',AGUARDANDO_EMBALAGEM:'Aguardando embalagem',EMBALAGEM_ENVIADA:'Embalagem enviada',EMBALAGEM_EM_ANALISE:'Em análise',EMBALAGEM_APROVADA:'Embalagem aprovada',AGUARDANDO_AGENDAMENTO:'Aguardando agendamento',RETIRADA_AGENDADA:'Retirada agendada',ENTREGADOR_DESIGNADO:'Entregador designado',ENTREGADOR_A_CAMINHO:'A caminho',ENTREGADOR_NO_LOCAL:'Chegou ao local',PRODUTO_COLETADO:'Produto coletado',EM_CONFERENCIA:'Em conferência',CONCLUIDA:'Concluída',PENDENCIA:'Pendente',CANCELADA:'Cancelada'})[s]||s}function badge(s){let cls=['CONCLUIDA','PRODUTO_COLETADO'].includes(s)?'green':['PENDENCIA','EMBALAGEM_EM_ANALISE','EMBALAGEM_ENVIADA'].includes(s)?'orange':['ENTREGADOR_A_CAMINHO','ENTREGADOR_DESIGNADO','RETIRADA_AGENDADA'].includes(s)?'blue':['CANCELADA'].includes(s)?'red':'';return `<span class="badge ${cls}">${esc(statusLabel(s))}</span>`}function log(op,text,author='Administração'){op.history=op.history||[];op.history.unshift({text,date:localNow(),author});op.updated=localNow()}function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}function setRoute(path,replace=false){if(replace)history.replaceState({},'',path);else history.pushState({},'',path);render()}window.addEventListener('popstate',render);function route(){let p=location.pathname.replace(/\/$/,'')||'/';if(p==='/operacao')return 'client';if(p==='/acesso')return 'access';if(p==='/admin/login')return 'login';if(p==='/admin/operacoes')return 'admin-operations';if(/^\/admin\/operacoes\/[^/]+$/.test(p))return 'admin-detail';if(p==='/admin/entregadores')return 'admin-deliveries';if(p==='/admin/configuracoes')return 'admin-settings';return p==='/admin/dashboard'||p==='/admin'?'admin-dashboard':'access'}function auth(){return sessionStorage.getItem('portal_admin_auth')==='yes'}function guard(){if(!auth()){returnTo=location.pathname==='/admin'?'admin-dashboard':location.pathname.includes('/operacoes/')?'admin-detail':'admin-dashboard';setRoute('/admin/login',true);return false}return true}function header(){return `<header class="topbar"><div class="brand"><div class="logo-mark">LKX</div><div class="brand-copy">${esc(db.settings.companyName)}<small>Gestão de operações</small></div></div><div class="top-right"><span class="admin-name small muted">Administrador</span><div class="avatar">AD</div></div></header>`}function nav(active){const items=[['admin-dashboard','▦','Visão geral','/admin/dashboard'],['admin-operations','▤','Operações','/admin/operacoes'],['admin-deliveries','↗','Entregadores','/admin/entregadores'],['admin-settings','⚙','Configurações','/admin/configuracoes']];return `<aside class="sidebar"><div class="nav-label">Menu</div>${items.map(([id,ic,label,url])=>`<button class="nav-item ${active===id?'active':''}" onclick="go('${url}')"><span class="nav-icon">${ic}</span>${label}</button>`).join('')}<div class="sidebar-bottom"><div class="nav-label">Conta</div><button class="nav-item" onclick="logout()"><span class="nav-icon">↪</span>Sair do painel</button></div></aside><nav class="mobile-nav">${items.map(([id,ic,label,url])=>`<button class="${active===id?'active':''}" onclick="go('${url}')"><span>${ic}</span>${label}</button>`).join('')}</nav>`}function adminShell(active,content){if(!guard())return;document.getElementById('app').innerHTML=`<div class="shell">${header()}<div class="admin-layout">${nav(active)}<main class="main">${content}</main></div></div>`}function operationRows(list){return list.map(o=>`<tr><td><button class="op-link" onclick="go('/admin/operacoes/${o.id}')">#${esc(o.number)}</button></td><td><div class="person"><div class="person-avatar">${esc(o.customer.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div>${esc(o.customer)}</div></td><td>${esc(o.product)}</td><td>${money(o.amount)}</td><td>${badge(o.status)}</td><td>${o.pickup?date(o.pickup.date,false):'—'}</td><td>${o.delivery?esc(o.delivery.name):'<span class="muted">A definir</span>'}</td><td>${date(o.updated)}</td></tr>`).join('')}function table(list){return `<div class="card"><div class="filters"><input id="q-filter" placeholder="⌕  Buscar operação ou cliente" oninput="filterOps()"><select id="status-filter" onchange="filterOps()"><option value="">Todos os status</option>${Array.from(new Set(db.operations.map(o=>o.status))).map(s=>`<option value="${s}">${statusLabel(s)}</option>`).join('')}</select><input id="date-filter" type="date" aria-label="Data" onchange="filterOps()"></div><div class="table-wrap"><table><thead><tr><th>Operação</th><th>Cliente</th><th>Produto</th><th>Valor</th><th>Status</th><th>Retirada</th><th>Entregador</th><th>Atualização</th></tr></thead><tbody id="ops-tbody">${operationRows(list)}</tbody></table></div><div class="table-foot"><span id="row-count">${list.length} operações</span><span>As alteracoes sao sincronizadas ao salvar</span></div></div>`}function dashboard(){let ops=db.operations;let metrics=[['TOTAL DE OPERAÇÕES',ops.length,'▤'],['EM ANDAMENTO',ops.filter(o=>!['CONCLUIDA','CANCELADA'].includes(o.status)).length,'◷'],['RETIRADAS AGENDADAS',ops.filter(o=>o.pickup).length,'▣'],['EM CONFERÊNCIA',ops.filter(o=>o.status==='EM_CONFERENCIA').length,'⌕'],['CONCLUÍDAS',ops.filter(o=>o.status==='CONCLUIDA').length,'✓'],['PENDÊNCIAS',ops.filter(o=>o.status==='PENDENCIA'||o.package?.status==='resubmit').length,'!']];adminShell('admin-dashboard',`<div class="page-head"><div><div class="eyebrow">Visão geral</div><h1>Painel de operacoes</h1><p>Acompanhe as operações e as atividades recentes.</p></div><div class="head-actions"><button class="btn btn-primary" onclick="openCreate()">＋ <span>Nova operação</span></button></div></div><div class="metric-grid">${metrics.map(([l,v,i])=>`<div class="card metric"><div class="metric-top">${l}<span class="metric-icon">${i}</span></div><div class="metric-value">${v}</div><div class="metric-note">No total</div></div>`).join('')}</div><div class="page-head" style="margin:28px 0 13px"><div><h2 style="font-size:15px;margin:0">Operações recentes</h2><p style="margin-top:4px">Últimas movimentações registradas</p></div><button class="btn btn-outline btn-sm" onclick="go('/admin/operacoes')">Ver todas →</button></div>${table(ops.slice().sort((a,b)=>new Date(b.updated)-new Date(a.updated)))}`)}function filterOps(){let q=(document.getElementById('q-filter')?.value||'').toLowerCase(),s=document.getElementById('status-filter')?.value||'',d=document.getElementById('date-filter')?.value||'';let list=db.operations.filter(o=>(!q||o.customer.toLowerCase().includes(q)||o.number.includes(q)||o.product.toLowerCase().includes(q))&&(!s||o.status===s)&&(!d||o.updated.slice(0,10)===d));document.getElementById('ops-tbody').innerHTML=operationRows(list);document.getElementById('row-count').textContent=`${list.length} operações`}function operationsPage(){adminShell('admin-operations',`<div class="page-head"><div><div class="eyebrow">Gestão</div><h1>Operações</h1><p>Consulte e acompanhe todas as operações.</p></div><button class="btn btn-primary" onclick="openCreate()">＋ <span>Nova operação</span></button></div>${table(db.operations)}`)}function deliveryPage(){const list=db.operations.filter(o=>o.delivery);adminShell('admin-deliveries',`<div class="page-head"><div><div class="eyebrow">Logística</div><h1>Entregadores</h1><p>Parceiros designados para as operações.</p></div><button class="btn btn-outline" onclick="go('/admin/operacoes')">Ver operações</button></div><div class="card table-wrap"><table><thead><tr><th>Parceiro</th><th>Entregador</th><th>Telefone</th><th>Veículo</th><th>Identificação</th><th>Previsão</th><th>Status</th><th>Operação</th></tr></thead><tbody>${list.map(o=>`<tr><td>${esc(o.delivery.company)}</td><td>${esc(o.delivery.name)}</td><td>${esc(o.delivery.phone)}</td><td>${esc(o.delivery.vehicle)} · ${esc(o.delivery.plate.slice(0,3))}••••</td><td>${esc(o.delivery.identification)}</td><td>${esc(o.delivery.eta||'—')}</td><td>${badge(o.delivery.status)}</td><td><button class="op-link" onclick="go('/admin/operacoes/${o.id}')">#${o.number} →</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty-state">Nenhum entregador designado ainda.</td></tr>'}</tbody></table></div>`)}function settingsPage(){let s=db.settings;adminShell('admin-settings',`<div class="page-head"><div><div class="eyebrow">Administração</div><h1>Configurações</h1><p>Identidade e canais de contato do portal.</p></div></div><form class="card panel" style="max-width:760px" onsubmit="saveSettings(event)"><h2>Identidade da empresa</h2><p class="sub">Personalize as informações exibidas no portal.</p><div class="field-grid"><div class="form-row"><label>Nome da empresa</label><input name="companyName" value="${esc(s.companyName)}" required></div><div class="form-row"><label>Domínio do portal</label><input name="domain" value="${esc(s.domain)}"></div><div class="form-row"><label>Telefone</label><input name="phone" value="${esc(s.phone)}"></div><div class="form-row"><label>WhatsApp</label><input name="whatsapp" value="${esc(s.whatsapp)}"></div><div class="form-row"><label>E-mail de suporte</label><input name="email" type="email" value="${esc(s.email)}"></div><div class="form-row"><label>Identidade visual</label><div class="upload-box"><strong>LKX</strong><small>Marca textual temporária, sem imagem.</small></div></div><div class="form-row"><label>Cor principal</label><input name="primaryColor" type="color" value="${esc(s.primaryColor)}"></div><div class="form-row"><label>Cor secundária</label><input name="secondaryColor" type="color" value="${esc(s.secondaryColor)}"></div><div class="form-row"><label>Cor de destaque</label><input name="accentColor" type="color" value="${esc(s.accentColor)}"></div><div class="form-row full"><label>Texto institucional</label><textarea name="institutional">${esc(s.institutional)}</textarea></div><div class="form-row full"><label>Mensagem de suporte</label><input name="support" value="${esc(s.support)}"></div></div><div class="form-actions"><button class="btn btn-primary">Salvar configurações</button></div></form>`)}function applyTheme(){document.documentElement.style.setProperty('--primary',db.settings.primaryColor||CONFIG.PRIMARY_COLOR);document.documentElement.style.setProperty('--secondary',db.settings.secondaryColor||CONFIG.SECONDARY_COLOR);document.documentElement.style.setProperty('--accent',db.settings.accentColor||CONFIG.ACCENT_COLOR)}function saveSettings(e){e.preventDefault();let f=new FormData(e.target);for(const k of Object.keys(db.settings))if(f.has(k))db.settings[k]=f.get(k);save();applyTheme();toast('Configurações salvas');settingsPage()}
function loginPage(){document.getElementById('app').innerHTML=`<main class="access-page"><section class="access-aside"><div class="aside-copy"><div class="eyebrow">Área administrativa</div><h2>Gestão clara para cada etapa da operação.</h2><p>Acompanhe cadastros, materiais enviados, retiradas e parceiros de coleta em um só lugar.</p></div></section><section class="access-main"><form class="access-box" onsubmit="adminLogin(event)"><div class="brand"><div class="logo-mark">LKX</div><div class="brand-copy">${esc(db.settings.companyName)}<small>Painel administrativo</small></div></div><h1>Painel Administrativo</h1><p>Acesse sua conta para continuar.</p><div class="form-row"><label>E-mail</label><input class="field" style="width:100%" name="email" type="email" placeholder="nome@empresa.com" required></div><div class="form-row" style="margin-top:14px"><label>Senha</label><input class="field" style="width:100%" name="password" type="password" placeholder="Sua senha" required></div><div id="login-error" class="form-error"></div><button class="btn btn-primary">Entrar no painel</button><div class="help"><a href="/acesso" onclick="event.preventDefault();go('/acesso')">← Voltar ao portal de acesso</a></div></form><div class="access-footer">Acesso restrito a usuários autorizados</div></section></main>`}function adminLogin(e){e.preventDefault();let f=new FormData(e.target);if(f.get('email')===db.admin.email&&f.get('password')===db.admin.password){sessionStorage.setItem('portal_admin_auth','yes');setRoute(returnTo==='admin-detail'?'/admin/operacoes/op_01':'/admin/dashboard',true)}else document.getElementById('login-error').textContent='E-mail ou senha inválidos.'}
function accessPage(){document.getElementById('app').innerHTML=`<main class="access-page"><section class="access-aside"><div class="aside-copy"><div class="brand"><div class="logo-mark">LKX</div><div class="brand-copy">${esc(db.settings.companyName)}<small>Transparência em cada etapa</small></div></div><div style="height:50px"></div><div class="eyebrow">Etapa importante da sua operação</div><h2>Conclua as etapas com tranquilidade e acompanhe a disponibilização do valor.</h2><p>${esc(db.settings.institutional)}</p></div></section><section class="access-main"><form class="access-box" onsubmit="accessOperation(event)"><div class="brand"><div class="logo-mark">LKX</div><div class="brand-copy">${esc(db.settings.companyName)}<small>Portal do cliente</small></div></div><h1>Acompanhe sua operação</h1><p>Digite a chave de acesso fornecida pela nossa equipe.</p><label class="label" for="access-key">Chave de acesso</label><div class="input-wrap"><input id="access-key" name="token" placeholder="XXXX-XXXX-XXXX" autocomplete="off" maxlength="14" required oninput="formatToken(this)"></div><div id="access-error" class="form-error"></div><button class="btn btn-primary">Acessar portal <span>→</span></button><div class="help">Precisa de ajuda?<a href="mailto:${esc(db.settings.email)}">${esc(db.settings.support)}</a></div></form><div class="access-footer">Ambiente seguro · Acesso individual</div></section></main>`}function formatToken(el){let v=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);el.value=v.match(/.{1,4}/g)?.join('-')||''}function accessOperation(e){e.preventDefault();let token=new FormData(e.target).get('token').toUpperCase().trim(),op=db.operations.find(x=>x.token===token&&x.tokenActive);if(!op){document.getElementById('access-error').textContent='Chave inválida ou indisponível. Confira e tente novamente.';return}if(op.status==='CONCLUIDA'&&op.blockWhenCompleted){document.getElementById('access-error').textContent='Esta operação foi concluída e o acesso está encerrado.';return}currentOp=op.id;log(op,'Cliente acessou o portal',op.customer);save();sessionStorage.setItem('portal_client_op',op.id);setRoute('/operacao')}
const steps=['Cadastro','Embalagem','Retirada','Entregador','Conclusão'];function stepIndex(o){if(o.status==='CONCLUIDA')return 5;if(o.status==='CANCELADA')return Math.max(0,o.step||0);return Math.min(4,Math.max(0,o.step||0))}function progress(o){let ix=stepIndex(o);return `<div class="steps-horizontal">${steps.map((s,i)=>`<div class="step ${i<ix?'done':i===ix?'current':''}"><div class="step-dot">${i<ix?'✓':String(i+1).padStart(2,'0')}</div><span>${s}</span></div>`).join('')}</div>`}function timeline(op){return `<div class="timeline">${(op.history||[]).slice(0,7).map(h=>`<div class="timeline-item"><span class="timeline-dot"></span><div><b>${esc(h.text)}</b><small>${date(h.date)} · ${esc(h.author)}</small></div></div>`).join('')||'<div class="empty-state">Nenhuma atualização registrada.</div>'}</div>`}function clientStep(op){let i=stepIndex(op);if(op.status==='CONCLUIDA')return `<div class="notice success"><b>Operação concluída</b><br>${esc(op.finalMessage||'As etapas previstas foram concluídas.')}</div>`;if(op.status==='CANCELADA')return '<div class="notice warning">Esta operação foi cancelada. Entre em contato com nossa equipe se precisar de ajuda.</div>';if(i===0)return op.registration?.complete?`<div class="notice success">✓ Dados enviados com sucesso. Seu cadastro foi concluído.</div>`:`<h2>Complete seu cadastro</h2><p class="sub">Preencha seus dados para seguir com a operação.</p><form onsubmit="saveRegistration(event)"><div class="field-grid"><div class="form-row"><label>Nome completo</label><input name="name" value="${esc(op.customer)}" required></div><div class="form-row"><label>CPF/CNPJ</label><input name="document" value="${esc(op.document)}" required></div><div class="form-row"><label>Telefone</label><input name="phone" value="${esc(op.phone)}" required></div><div class="form-row"><label>E-mail</label><input name="email" type="email" value="${esc(op.email)}" required></div><div class="form-row"><label>Banco</label><input name="bank" required></div><div class="form-row"><label>Agência</label><input name="agency" required></div><div class="form-row"><label>Conta</label><input name="account" required></div><div class="form-row"><label>Tipo de conta</label><select name="accountType" required><option value="">Selecione</option><option>Corrente</option><option>Poupança</option><option>Pagamento</option></select></div><div class="form-row full"><label>Chave Pix</label><input name="pix" required></div><div class="form-row"><label>CEP</label><input name="zip" required></div><div class="form-row"><label>Rua</label><input name="street" required></div><div class="form-row"><label>Número</label><input name="addressNumber" required></div><div class="form-row"><label>Complemento</label><input name="complement"></div><div class="form-row"><label>Bairro</label><input name="neighborhood" required></div><div class="form-row"><label>Cidade</label><input name="city" required></div><div class="form-row"><label>Estado</label><input name="state" maxlength="2" required></div></div><div class="form-actions"><button class="btn btn-primary">Salvar informações</button></div></form>`;if(i===1){let p=op.package||{};if(p.status==='approved')return `<div class="notice success">✓ Etapa liberada automaticamente. Você já pode agendar a retirada na etapa seguinte.</div>`;return `<h2>Prepare seu produto para retirada</h2><p class="sub">Certifique-se de que o produto esteja devidamente acondicionado antes da chegada da equipe de coleta.</p>${p.status==='resubmit'?`<div class="notice warning" style="margin-bottom:14px"><b>Precisamos de um novo envio</b><br>${esc(p.request||'Confira o material e envie novamente.')}</div>`:''}${p.status==='review'?`<div class="notice" style="margin-bottom:14px">Envio recebido. A etapa será liberada automaticamente.</div>${(op.package.files||[]).map(f=>`<a href="${esc(f.url||'#')}" target="_blank" rel="noopener" class="small" style="display:block;margin:8px 0;color:var(--primary)">Visualizar arquivo: ${esc(f.name)}</a>`).join('')}`:`<form onsubmit="submitPackage(event)"><div class="upload-grid"><div class="upload-box"><strong>Foto do produto</strong><small>Imagem JPG, PNG ou WEBP (até 10 MB)</small><input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></div><div class="upload-box"><strong>Vídeo da embalagem</strong><small>Vídeo MP4 ou MOV (até 50 MB)</small><input name="video" type="file" accept="video/mp4,video/quicktime" required></div></div><div class="form-actions"><button class="btn btn-primary">Enviar e avançar etapa</button></div></form>`}`};if(i===2){if(op.pickup)return `<div class="notice success">Retirada agendada para ${date(op.pickup.date,false)}, ${esc(op.pickup.period)}.</div><div class="delivery-detail" style="margin-top:16px"><div><small>Endereço de retirada</small><b>${esc(op.pickup.address)}</b></div><div><small>Observações</small><b>${esc(op.pickup.notes||'—')}</b></div></div>`;return `<h2>Agende a retirada do produto</h2><p class="sub">Escolha uma data e período para a equipe de coleta.</p><form onsubmit="savePickup(event)"><div class="field-grid"><div class="form-row"><label>Data</label><input type="date" name="date" min="${new Date().toISOString().slice(0,10)}" required></div><div class="form-row"><label>Período de horário</label><select name="period" required><option value="">Selecione</option><option>08:00 – 10:00</option><option>10:00 – 12:00</option><option>12:00 – 14:00</option><option>14:00 – 16:00</option><option>16:00 – 18:00</option></select></div><div class="form-row full"><label>Endereço de retirada</label><input name="address" value="${esc(op.pickupAddress||'')}" required></div><div class="form-row full"><label>Observações</label><textarea name="notes" placeholder="Ponto de referência, instruções de acesso…"></textarea></div></div><div class="form-actions"><button class="btn btn-primary">Confirmar agendamento</button></div></form>`};if(i===3){let d=op.delivery;if(!d)return '<div class="empty-state">Aguardando definição do parceiro de coleta.</div>';return `<div class="delivery-detail"><div><small>Entregador</small><b>${esc(d.name)}</b></div><div><small>Empresa parceira</small><b>${esc(d.company)}</b></div><div><small>Telefone operacional</small><b>${esc(d.phone)}</b></div><div><small>Identificação</small><b>${esc(d.identification)}</b></div><div><small>Veículo</small><b>${esc(d.vehicle)} · ${esc(d.model)}</b></div><div><small>Placa</small><b>${esc(d.plate.slice(0,3))}••••</b></div><div><small>Previsão de retirada</small><b>${esc(d.eta||'A confirmar')}</b></div><div><small>Status</small><b>${badge(d.status)}</b></div></div>`};if(i===4)return `<div class="notice success"><b>Produto coletado</b><br>A operação encontra-se em processo de conferência.</div><div style="margin-top:14px">Status: ${badge(op.status==='CONCLUIDA'?'CONCLUIDA':'EM_CONFERENCIA')}</div>`;return ''}
function clientPortal(){let id=sessionStorage.getItem('portal_client_op')||currentOp,op=db.operations.find(x=>x.id===id);if(!op){setRoute('/acesso',true);return}currentOp=id;let ix=stepIndex(op);document.getElementById('app').innerHTML=`<div class="notice-bar">As informações exibidas são vinculadas exclusivamente à sua operação.</div><main class="client-page"><header class="client-header"><div class="brand"><div class="logo-mark">LKX</div><div class="brand-copy">${esc(db.settings.companyName)}<small>Portal da Operação</small></div></div><button class="btn btn-outline btn-sm" onclick="clientLogout()">Sair</button></header><div class="welcome"><div><h1>Olá, ${esc(op.customer.split(' ')[0])}</h1><p>Operação #${esc(op.number)} · Atualizada ${date(op.updated)}</p></div>${badge(op.status)}</div><section class="card operation-hero"><div><div class="eyebrow">Produto</div><div class="product-name">${esc(op.product)}</div></div><div class="amount"><div class="eyebrow">Valor disponível</div><strong>${money(op.amount)}</strong></div><div class="disclaimer">O valor informado está vinculado a esta operação e sua disponibilização está condicionada à conclusão das etapas previstas e aprovação interna.</div></section><section class="card progress-card" style="margin-top:14px"><h2 class="section-title">Etapas da operação</h2>${progress(op)}</section><div class="content-grid"><div><section class="card panel step-panel"><h2>Etapa ${String(Math.min(ix+1,5)).padStart(2,'0')} · ${steps[Math.min(ix,4)]}</h2><p class="sub">Acompanhe as instruções e atualizações desta etapa.</p><div class="step-panel-content">${clientStep(op)}</div></section><section class="card panel" style="margin-top:14px"><h2>Atualizações da operação</h2><p class="sub">Comunicados enviados pela equipe.</p>${op.messages?.length?op.messages.slice().reverse().map(m=>`<div class="message"><p>${esc(m.text)}</p><small>${date(m.date)} · ${esc(m.author)}</small></div>`).join(''):'<div class="empty-state">Ainda não há comunicados.</div>'}</section></div><div><section class="card panel"><h2>Histórico</h2><p class="sub">Movimentações recentes da operação.</p>${timeline(op)}</section><section class="card panel" style="margin-top:14px"><h2>Precisa de ajuda?</h2><p class="sub">Nossa equipe está disponível para orientar você.</p><a class="btn btn-outline btn-sm" style="text-decoration:none" href="https://wa.me/${esc(db.settings.whatsapp)}" target="_blank" rel="noopener">Falar pelo WhatsApp ↗</a></section></div></div></main>`}
function clientLogout(){sessionStorage.removeItem('portal_client_op');currentOp=null;setRoute('/acesso')}
function withClient(fn){let op=db.operations.find(x=>x.id===(sessionStorage.getItem('portal_client_op')||currentOp));if(!op)return;fn(op);save();clientPortal()}
function saveRegistration(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));withClient(op=>{op.customer=f.name;op.document=f.document;op.phone=f.phone;op.email=f.email;op.registration={...f,complete:true};op.step=1;op.status='AGUARDANDO_EMBALAGEM';log(op,'Dados cadastrados',op.customer)})}
function submitPackage(e){e.preventDefault();let form=e.target,photo=form.photo.files[0],video=form.video.files[0],validImg=['image/jpeg','image/png','image/webp'],validVid=['video/mp4','video/quicktime'];if(!validImg.includes(photo.type)||photo.size>10*1024*1024){toast('A foto deve ser JPG, PNG ou WEBP e ter até 10 MB.');return}if(!validVid.includes(video.type)||video.size>50*1024*1024){toast('O vídeo deve ser MP4 ou MOV e ter até 50 MB.');return}withClient(op=>{op.package={status:'review',files:[{name:photo.name,type:photo.type,size:photo.size},{name:video.name,type:video.type,size:video.size}],request:''};op.status='EMBALAGEM_EM_ANALISE';log(op,'Material de embalagem enviado',op.customer);op.history[0].text+=' (foto e vídeo)'})}

function adminDetail(){adminDetailView(decodeURIComponent(location.pathname.split('/').pop()))}function adminDetailView(requestedId){if(!guard())return;let id=requestedId||decodeURIComponent(location.pathname.split('/').pop()),op=db.operations.find(x=>x.id===id);if(!op){go('/admin/operacoes');return}let statusOptions=['AGUARDANDO_CADASTRO','CADASTRO_CONCLUIDO','AGUARDANDO_EMBALAGEM','EMBALAGEM_ENVIADA','EMBALAGEM_EM_ANALISE','EMBALAGEM_APROVADA','AGUARDANDO_AGENDAMENTO','RETIRADA_AGENDADA','ENTREGADOR_DESIGNADO','ENTREGADOR_A_CAMINHO','ENTREGADOR_NO_LOCAL','PRODUTO_COLETADO','EM_CONFERENCIA','CONCLUIDA','PENDENCIA','CANCELADA'];adminShell('admin-operations',`<div class="page-head"><div><button class="btn btn-quiet btn-sm" onclick="go('/admin/operacoes')">← Operações</button><div class="eyebrow" style="margin-top:9px">Detalhes da operação</div><h1>Operação #${esc(op.number)}</h1><p>Criada em ${date(op.created)}</p></div><div class="head-actions"><button class="btn btn-outline" onclick="openEdit('${op.id}')">Editar operação</button><button class="btn btn-primary" onclick="openDelivery('${op.id}')">＋ <span>Entregador</span></button></div></div><div class="admin-detail"><section class="card panel wide"><h2>Resumo da operação</h2><p class="sub">Informações do cliente e do produto</p><div class="detail-facts"><div><small>Cliente</small><b>${esc(op.customer)}</b></div><div><small>Documento</small><b>${esc(op.document)}</b></div><div><small>Telefone</small><b>${esc(op.phone)}</b></div><div><small>E-mail</small><b>${esc(op.email)}</b></div><div><small>Produto</small><b>${esc(op.product)}</b></div><div><small>Valor disponível</small><b>${money(op.amount)}</b></div></div><div style="border-top:1px solid var(--line);margin-top:17px;padding-top:14px"><div class="eyebrow">Status geral</div><div style="margin-top:8px">${badge(op.status)}</div><div style="margin-top:18px">${progress(op)}</div></div><div class="admin-action-list"><button class="btn btn-outline btn-sm" onclick="openNotice('${op.id}')">＋ Comunicado</button><button class="btn btn-outline btn-sm" onclick="reopenStage('${op.id}')">Reabrir etapa</button><button class="btn btn-outline btn-sm" onclick="rotateToken('${op.id}')">Gerar nova chave</button><button class="btn btn-outline btn-sm" onclick="copyToken('${op.id}')">Copiar chave</button></div></section><section class="card panel"><h2>Status da opera\u00e7\u00e3o</h2><p class="sub">O status acompanha as a\u00e7\u00f5es conclu\u00eddas em cada etapa.</p><div style="margin-bottom:14px">${badge(op.status)}</div><div class="switch-row"><span>Chave de acesso ativa</span><input class="switch" type="checkbox" ${op.tokenActive?'checked':''} onchange="toggleToken('${op.id}',this.checked)"></div><div class="switch-row"><span>Bloquear acesso ap\u00f3s conclus\u00e3o</span><input class="switch" type="checkbox" ${op.blockWhenCompleted?'checked':''} onchange="toggleBlock('${op.id}',this.checked)"></div></section><section class="card panel"><h2>Etapa de embalagem</h2><p class="sub">A etapa é liberada automaticamente. Os arquivos não ficam disponíveis para a equipe.</p>${op.package?.files?.length?`<div class="small">${op.package.files.map(f=>`<div style="padding:7px 0"><a href="${esc(f.url||'#')}" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none">📎 ${esc(f.name)}</a> <span class="muted">(${(f.size/1024/1024).toFixed(1)} MB)</span></div>`).join('')}</div>`:'<div class="empty-state">Os arquivos nao sao armazenados nem ficam disponiveis para a equipe.</div>'}${op.package?.status==='review'?`<div class="admin-action-list"><button class="btn btn-primary btn-sm" onclick="reviewPackage('${op.id}','approved')">Aprovar</button><button class="btn btn-outline btn-sm" onclick="openResubmit('${op.id}')">Solicitar novo envio</button></div>`:op.package?.status==='approved'?'<div class="notice success">Etapa liberada automaticamente</div>':''}</section><section class="card panel"><h2>Retirada</h2><p class="sub">Agendamento informado pelo cliente.</p>${op.pickup?`<div class="delivery-detail"><div><small>Data</small><b>${date(op.pickup.date,false)}</b></div><div><small>Período</small><b>${esc(op.pickup.period)}</b></div><div style="grid-column:1/-1"><small>Endereço</small><b>${esc(op.pickup.address)}</b></div></div>`:'<div class="empty-state">Ainda não agendada.</div>'}<button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="editPickup('${op.id}')">Alterar agendamento</button></section><section class="card panel"><h2>Entregador</h2><p class="sub">Parceiro de coleta designado.</p>${op.delivery?`<div class="delivery-detail"><div><small>Nome</small><b>${esc(op.delivery.name)}</b></div><div><small>Empresa</small><b>${esc(op.delivery.company)}</b></div><div><small>Veículo</small><b>${esc(op.delivery.vehicle)} · ${esc(op.delivery.plate)}</b></div><div><small>Previsão</small><b>${esc(op.delivery.eta)}</b></div></div><select class="field" style="width:100%;margin-top:12px" onchange="deliveryStatus('${op.id}',this.value)">${['ENTREGADOR_DESIGNADO','ENTREGADOR_A_CAMINHO','ENTREGADOR_NO_LOCAL','PRODUTO_COLETADO'].map(s=>`<option value="${s}" ${op.delivery.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>`:'<div class="empty-state">Nenhum parceiro designado.</div>'}<button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="openDelivery('${op.id}')">${op.delivery?'Editar entregador':'Cadastrar entregador'}</button></section><section class="card panel"><h2>Chave de acesso</h2><p class="sub">Compartilhe o link público e a chave em canais separados.</p><div class="key-display" style="font-size:15px">Chave protegida — use “Gerar nova chave” para compartilhá-la</div><div class="admin-action-list"><button class="btn btn-outline btn-sm" onclick="copyToken('${op.id}')">Copiar chave</button><button class="btn btn-outline btn-sm" onclick="copyLink()">Copiar link /acesso</button><button class="btn btn-outline btn-sm" onclick="go('/acesso')">Abrir portal</button></div><div class="small muted" style="margin-top:10px">Último acesso: ${esc(op.lastAccess?date(op.lastAccess):'Ainda não acessado')}</div></section><section class="card panel"><h2>Histórico administrativo</h2><p class="sub">Registro das atualizações relevantes.</p>${timeline(op)}</section><section class="card panel"><h2>Observações internas</h2><p class="sub">Visível apenas no painel administrativo.</p><p class="small">${esc(op.notes||'Sem observações.')}</p><button class="btn btn-outline btn-sm" onclick="editNotes('${op.id}')">Editar observações</button></section><section class="card panel"><h2>Conclusão</h2><p class="sub">Mensagem final e encerramento.</p><textarea class="field" style="width:100%;min-height:75px" id="final-msg">${esc(op.finalMessage||'')}</textarea><div class="admin-action-list"><button class="btn btn-outline btn-sm" onclick="saveFinal('${op.id}')">Salvar mensagem</button><button class="btn btn-primary btn-sm" onclick="finishOperation('${op.id}')">Concluir operação</button><button class="btn btn-danger btn-sm" onclick="cancelOperation('${op.id}')">Cancelar</button></div></section></div>`)}
function modal(title,body,submitLabel='Salvar',onSubmit=''){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="btn btn-quiet" onclick="closeModal()">✕</button></div><form onsubmit="${onSubmit}"><div class="modal-body">${body}</div><div class="modal-foot"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary">${submitLabel}</button></div></form></div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML=''}function openCreate(){modal('Nova operação',`<div class="field-grid"><div class="form-row"><label>Nome do cliente</label><input name="customer" required></div><div class="form-row"><label>CPF/CNPJ</label><input name="document" required></div><div class="form-row"><label>Telefone</label><input name="phone" required></div><div class="form-row"><label>E-mail</label><input name="email" type="email" required></div><div class="form-row"><label>Produto anunciado</label><input name="product" required></div><div class="form-row"><label>Valor disponível (R$)</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="form-row full"><label>Endereço de retirada</label><input name="pickupAddress"></div><div class="form-row full"><label>Observações</label><textarea name="notes"></textarea></div><div class="form-row full"><label class="small muted"><input type="checkbox" name="blockWhenCompleted" checked> Encerrar acesso do cliente após conclusão</label></div></div>`,'Criar operação','createOperation(event)')}function randomToken(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x='';for(let i=0;i<12;i++)x+=chars[Math.floor(Math.random()*chars.length)];return x.match(/.{4}/g).join('-')}function randomNumber(){let n;do{n=String(Math.floor(100000+Math.random()*899999))}while(db.operations.some(o=>o.number===n));return n}function createOperation(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let op={id:'op_'+crypto.randomUUID(),number:randomNumber(),token:randomToken(),tokenActive:true,blockWhenCompleted:!!f.blockWhenCompleted,customer:f.customer,document:f.document,phone:f.phone,email:f.email,product:f.product,amount:Number(f.amount),status:'AGUARDANDO_CADASTRO',created:localNow(),updated:localNow(),step:0,registration:null,package:{status:'pending',files:[],request:''},pickup:null,pickupAddress:f.pickupAddress||'',delivery:null,messages:[],history:[],finalMessage:'',notes:f.notes||''};log(op,'Operação criada');db.operations.unshift(op);save();closeModal();adminDetailForNew(op.id,op.token)}function adminDetailForNew(id,token){returnTo='admin-detail';history.pushState({},'','/admin/operacoes/'+id);adminDetail();document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Operação criada com sucesso</h2></div><div class="modal-body"><div class="success-block">A operação <b>#${db.operations.find(x=>x.id===id).number}</b> já está pronta para compartilhar.</div><p class="small muted">Chave de acesso individual</p><div class="key-display">${esc(token)}</div><p class="small muted" style="margin-top:14px">O link público é sempre <b>${esc(db.settings.domain)}/acesso</b>. Envie o link e a chave ao cliente.</p></div><div class="modal-foot"><button class="btn btn-outline" onclick="copyToken('${id}')">Copiar chave</button><button class="btn btn-outline" onclick="copyLink()">Copiar link</button><button class="btn btn-primary" onclick="closeModal()">Abrir operação</button></div></div></div>`}
function getOp(id){return db.operations.find(o=>o.id===id)}function changeStatus(id,s){let o=getOp(id);o.status=s;if(s==='CONCLUIDA')o.completed=localNow();if(s==='RETIRADA_AGENDADA')o.step=Math.max(o.step,3);if(s==='ENTREGADOR_DESIGNADO')o.step=4;if(s==='PRODUTO_COLETADO'||s==='EM_CONFERENCIA')o.step=4;log(o,`Status alterado para ${statusLabel(s)}`);save();adminDetail()}function toggleToken(id,v){let o=getOp(id);o.tokenActive=v;log(o,`Chave de acesso ${v?'ativada':'revogada'}`);save();toast('Chave atualizada')}function toggleBlock(id,v){let o=getOp(id);o.blockWhenCompleted=v;log(o,`Bloqueio após conclusão ${v?'ativado':'desativado'}`);save();toast('Preferência salva')}function reviewPackage(id,status){let o=getOp(id);o.package.status=status;o.package.request='';if(status==='approved'){o.status='AGUARDANDO_AGENDAMENTO';o.step=2;log(o,'Embalagem aprovada');o.messages.push({text:'O material de embalagem foi aprovado. Agora você pode agendar a retirada.',author:'Equipe de operações',date:localNow()})}save();adminDetail()}function openResubmit(id){modal('Solicitar novo envio',`<div class="form-row"><label>Mensagem para o cliente</label><textarea name="request" required placeholder="Explique o que precisa ser ajustado…"></textarea></div>`,'Enviar solicitação',`requestResubmit(event,'${id}')`)}function requestResubmit(e,id){e.preventDefault();let msg=new FormData(e.target).get('request'),o=getOp(id);o.package.status='resubmit';o.package.request=msg;o.status='PENDENCIA';log(o,'Novo envio de embalagem solicitado');o.messages.push({text:msg,author:'Equipe de operações',date:localNow()});save();closeModal();adminDetail()}function openNotice(id){modal('Enviar comunicado',`<div class="form-row"><label>Mensagem</label><textarea name="text" required placeholder="Escreva uma atualização para o cliente…"></textarea></div>`,'Enviar comunicado',`sendNotice(event,'${id}')`)}function sendNotice(e,id){e.preventDefault();let msg=new FormData(e.target).get('text'),o=getOp(id);o.messages.push({text:msg,author:'Equipe de operações',date:localNow()});log(o,'Comunicado enviado ao cliente');save();closeModal();adminDetail()}function reopenStage(id){let o=getOp(id);modal('Reabrir etapa',`<div class="form-row"><label>Etapa</label><select name="stage"><option value="0">Cadastro</option><option value="1">Embalagem</option><option value="2">Retirada</option><option value="3">Entregador</option><option value="4">Conclusão</option></select></div>`,'Reabrir etapa',`doReopen(event,'${id}')`)}function doReopen(e,id){e.preventDefault();let i=Number(new FormData(e.target).get('stage')),o=getOp(id);o.step=i;o.status=['AGUARDANDO_CADASTRO','AGUARDANDO_EMBALAGEM','AGUARDANDO_AGENDAMENTO','ENTREGADOR_DESIGNADO','EM_CONFERENCIA'][i];if(i===0)o.registration=null;if(i===1)o.package={status:'pending',files:[],request:''};if(i===2)o.pickup=null;log(o,`Etapa ${steps[i]} reaberta`);save();closeModal();adminDetail()}function rotateToken(id){let o=getOp(id);o.token=randomToken();o.tokenActive=true;log(o,'Chave de acesso renovada');save();adminDetail();toast('Nova chave gerada')}async function copyToken(id){let o=getOp(id);try{await navigator.clipboard.writeText(o.token);toast('Chave copiada')}catch{toast(`Chave: ${o.token}`)}}async function copyLink(){try{await navigator.clipboard.writeText((db.settings.domain||location.origin)+'/acesso');toast('Link copiado')}catch{toast('Link: '+(db.settings.domain||location.origin)+'/acesso')}}function openDelivery(id){let o=getOp(id),d=o.delivery||{};modal('Cadastro do entregador',`<div class="field-grid"><div class="form-row"><label>Nome</label><input name="name" value="${esc(d.name||'')}" required></div><div class="form-row"><label>Empresa parceira</label><input name="company" value="${esc(d.company||'')}" required></div><div class="form-row"><label>Telefone</label><input name="phone" value="${esc(d.phone||'')}" required></div><div class="form-row"><label>Identificação</label><input name="identification" value="${esc(d.identification||'')} ões internas',`<div class="form-row"><label>Notas internas</label><textarea name="notes">${esc(o.notes||'')}</textarea></div>`,'Salvar observações',`saveNotes(event,'${id}')`)}function saveNotes(e,id){e.preventDefault();let o=getOp(id);o.notes=new FormData(e.target).get('notes');log(o,'Observações internas alteradas');save();closeModal();adminDetail()}function editPickup(id){let o=getOp(id),p=o.pickup||{};modal('Alterar agendamento',`<div class="field-grid"><div class="form-row"><label>Data</label><input name="date" type="date" value="${esc(p.date||'')}" required></div><div class="form-row"><label>Período</label><select name="period"><option>${esc(p.period||'08:00 – 10:00')}</option><option>08:00 – 10:00</option><option>10:00 – 12:00</option><option>12:00 – 14:00</option><option>14:00 – 16:00</option><option>16:00 – 18:00</option></select></div><div class="form-row full"><label>Endereço</label><input name="address" value="${esc(p.address||o.pickupAddress||'')}" required></div><div class="form-row full"><label>Observações</label><textarea name="notes">${esc(p.notes||'')}</textarea></div></div>`,'Salvar agendamento',`saveEditedPickup(event,'${id}')`)}function saveEditedPickup(e,id){e.preventDefault();let o=getOp(id),f=Object.fromEntries(new FormData(e.target));o.pickup=f;o.step=Math.max(3,o.step);if(o.status==='AGUARDANDO_AGENDAMENTO')o.status='RETIRADA_AGENDADA';log(o,'Agendamento de retirada atualizado');save();closeModal();adminDetail()}function openEdit(id){let o=getOp(id);modal('Editar operação',`<div class="field-grid"><div class="form-row"><label>Cliente</label><input name="customer" value="${esc(o.customer)}" required></div><div class="form-row"><label>CPF/CNPJ</label><input name="document" value="${esc(o.document)}"></div><div class="form-row"><label>Telefone</label><input name="phone" value="${esc(o.phone)}"></div><div class="form-row"><label>E-mail</label><input name="email" type="email" value="${esc(o.email)}"></div><div class="form-row"><label>Produto</label><input name="product" value="${esc(o.product)}" required></div><div class="form-row"><label>Valor disponível (R$)</label><input name="amount" type="number" min="0" step="0.01" value="${esc(o.amount)}" required></div><div class="form-row full"><label>Endereço base para retirada</label><input name="pickupAddress" value="${esc(o.pickupAddress||'')}"></div><div class="form-row full"><label>Observações internas</label><textarea name="notes">${esc(o.notes||'')}</textarea></div></div>`,'Salvar alterações',`saveEdit(event,'${id}')`)}function saveEdit(e,id){e.preventDefault();let o=getOp(id),f=Object.fromEntries(new FormData(e.target));for(const k of ['customer','document','phone','email','product','pickupAddress','notes'])o[k]=f[k];o.amount=Number(f.amount);log(o,'Informações da operação atualizadas');save();closeModal();adminDetail()}function render(){applyTheme();let r=route();if(r==='access'){accessPage();return}if(r==='client'){clientPortal();return}if(r==='login'){loginPage();return}if(r==='admin-dashboard'){dashboard();return}if(r==='admin-operations'){operationsPage();return}if(r==='admin-detail'){adminDetailView();return}if(r==='admin-deliveries'){deliveryPage();return}if(r==='admin-settings'){settingsPage();return}accessPage()}
